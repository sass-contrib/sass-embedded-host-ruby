# TODO: remove after https://github.com/sass/dart-sass/pull/2413
name: Build dart-sass
description: Build dart-sass from source with patch from https://github.com/sass/dart-sass/pull/2413
runs:
  using: composite
  steps:
    - uses: bufbuild/buf-action@v1
      with:
        setup_only: true

    - uses: dart-lang/setup-dart@v1
      with:
        problem-matcher: false

    - uses: actions/setup-node@v7

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ruby
        bundler-cache: true

    - run: bundle exec rake compile
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash

    - id: version
      run: |
        echo "implementation-version=$(bundle exec sass --embedded --version | yq .implementationVersion)" | tee -a "$GITHUB_OUTPUT"
        echo "protocol-version=$(bundle exec sass --embedded --version | yq .protocolVersion)" | tee -a "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/checkout@v7
      with:
        repository: sass/dart-sass
        ref: ${{ steps.version.outputs.implementation-version }}
        path: dart-sass

    - uses: actions/checkout@v7
      with:
        repository: sass/sass
        ref: embedded-protocol-${{ steps.version.outputs.protocol-version }}
        path: dart-sass/build/language

    - run: curl -fsSL -- https://github.com/sass/dart-sass/pull/2413.diff | git apply -
      working-directory: dart-sass
      shell: bash

    - run: dart pub get
      working-directory: dart-sass
      shell: bash

    - run: dart run grinder protobuf pkg-npm-release
      env:
        UPDATE_SASS_SASS_REPO: false
      working-directory: dart-sass
      shell: bash

    - run: npm pack
      working-directory: dart-sass/build/npm
      shell: bash

    - run: mv dart-sass/build/npm/sass-${{ steps.version.outputs.implementation-version }}.tgz ext/sass
      shell: bash

    - run: npm install sass@file:sass-${{ steps.version.outputs.implementation-version }}.tgz
      working-directory: ext/sass
      shell: bash

    - run: git add ext/sass/sass-${{ steps.version.outputs.implementation-version }}.tgz ext/sass/package.json
      shell: bash

    - run: git clean -dffx
      shell: bash

    - run: git diff HEAD
      shell: bash
