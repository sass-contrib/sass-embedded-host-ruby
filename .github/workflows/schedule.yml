name: schedule

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  spec:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - ubuntu-26.04-arm
          - windows-latest
          - windows-11-arm
        ruby-version:
          - ruby-head
          - jruby-head
          - truffleruby-head
          - truffleruby+graalvm-head
        exclude:
          - os: windows-latest
            ruby-version: truffleruby-head
          - os: windows-latest
            ruby-version: truffleruby+graalvm-head
          - os: windows-11-arm
            ruby-version: truffleruby-head
          - os: windows-11-arm
            ruby-version: truffleruby+graalvm-head

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup java
        if: matrix.ruby-version == 'jruby-head'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
        # TODO: remove after https://github.com/protocolbuffers/protobuf/pull/30941 lands in a stable release.
        # NOTE: the extra `--` is intentional. It prevents `rake` from parsing subsequent arugments as invalid options.
        env:
          BUNDLE_BUILD__GOOGLE___PROTOBUF: ${{ matrix.ruby-version == 'ruby-head' && '-- --with-cflags=-Wno-error=incompatible-pointer-types' || '' }}

      - name: Compile
        run: bundle exec rake compile
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Spec
        run: bundle exec rake spec

      # TODO: remove after https://github.com/protocolbuffers/protobuf/pull/30941 lands in a stable release.
      # NOTE: the double extra `--` is intentional.
      - name: Workaround protobuf issue on ruby-head
        if: matrix.ruby-version == 'ruby-head'
        run: gem install google-protobuf -- -- --with-cflags=-Wno-error=incompatible-pointer-types

      - name: Install
        run: rake -f -r bundler/gem_tasks install
